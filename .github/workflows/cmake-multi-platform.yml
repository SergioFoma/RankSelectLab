name: CMake CI

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl

    steps:
    # Загружаем проект вместе с подмодулями (CLI11, benchmark и т.д.)
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    # Установка Ninja, TBB и свежего GCC 14 на Linux
    - name: Install Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build libtbb-dev g++-14 gcc-14

    # Перенаправляем стандартный gcc на gcc-14 для поддержки модулей C++20
    - name: Set GCC 14 paths
      if: matrix.c_compiler == 'gcc'
      run: |
        echo "CC=gcc-14" >> $GITHUB_ENV
        echo "CXX=g++-14" >> $GITHUB_ENV

    # Установка Ninja и TBB на Windows через vcpkg.
    # GTest ставим тоже через vcpkg: при сборке из FetchContent googletest
    # собирается со своими флагами "-W4 -WX", а проектный "-Wall" для MSVC
    # превращается в "/Wall" и любое предупреждение в gtest становится ошибкой.
    - name: Install Dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        choco install ninja -y
        vcpkg install tbb:x64-windows gtest:x64-windows

    # Добавляем DLL-ки vcpkg (TBB) в PATH, иначе тесты/приложение не запустятся
    - name: Add vcpkg DLLs to PATH (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

    # Настройка окружения MSVC для Windows
    - name: Set up MSVC Developer Command Prompt
      if: matrix.os == 'windows-latest'
      uses: ilammy/msvc-dev-cmd@v1

    # Конфигурация CMake (Linux)
    - name: Configure CMake (Linux)
      if: runner.os != 'Windows'
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_C_COMPILER=${{ env.CC != '' && env.CC || matrix.c_compiler }} \
          -DCMAKE_CXX_COMPILER=${{ env.CXX != '' && env.CXX || matrix.cpp_compiler }} \
          -DCMAKE_CXX_SCAN_FOR_MODULES=ON \
          -DBUILD_TESTS=ON

    # Конфигурация CMake (Windows)
    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        cmake -B build -G Ninja `
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} `
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} `
          -DCMAKE_CXX_SCAN_FOR_MODULES=ON `
          -DBUILD_TESTS=ON `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

    # Сборка проекта
    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }}

    # Запуск unit-тестов (Linux)
    - name: Run Unit Tests (Linux)
      if: runner.os != 'Windows'
      run: |
        if [ ! -x build/tests/unit_tests ]; then
          echo "Unit tests executable not found"
          exit 1
        fi
        ./build/tests/unit_tests --gtest_color=no

    # Запуск end-to-end тестов (Linux)
    # Сам e2e-исполняемый файл всегда возвращает 0, поэтому проверяем вывод.
    - name: Run End-to-End Tests (Linux)
      if: runner.os != 'Windows'
      run: |
        if [ ! -x build/tests/end_to_end_tests ]; then
          echo "End-to-end tests executable not found"
          exit 1
        fi
        ./build/tests/end_to_end_tests > e2e_tests.log 2>&1
        status=$?
        cat e2e_tests.log
        if [ "$status" -ne 0 ]; then
          echo "End-to-end tests exited with code $status"
          exit 1
        fi
        if grep -q "\[FAILED\]" e2e_tests.log; then
          echo "End-to-end tests failed"
          exit 1
        fi

    # Запуск unit-тестов (Windows)
    - name: Run Unit Tests (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $exe = "build/tests/unit_tests.exe"
        if (-not (Test-Path $exe)) {
          Write-Host "Unit tests executable not found"
          exit 1
        }
        & $exe --gtest_color=no
        if ($LASTEXITCODE -ne 0) {
          Write-Host "Unit tests failed"
          exit $LASTEXITCODE
        }

    # Запуск end-to-end тестов (Windows)
    # Сам e2e-исполняемый файл всегда возвращает 0, поэтому проверяем вывод.
    - name: Run End-to-End Tests (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $exe = "build/tests/end_to_end_tests.exe"
        if (-not (Test-Path $exe)) {
          Write-Host "End-to-end tests executable not found"
          exit 1
        }
        $output = (& $exe 2>&1 | Out-String)
        $status = $LASTEXITCODE
        Write-Host $output
        if ($status -ne 0) {
          Write-Host "End-to-end tests exited with code $status"
          exit $status
        }
        if ($output -match "\[FAILED\]") {
          Write-Host "End-to-end tests failed"
          exit 1
        }

    # Запуск программы (Linux)
    - name: Run Executable (Linux)
      if: runner.os != 'Windows'
      run: |
        EXE="build/src/target"
        if [ ! -x "$EXE" ]; then
          echo "Executable not found"
          exit 1
        fi
        echo "Running $EXE..."
        "$EXE" --input-file materials/input_100.txt

    # Запуск программы (Windows)
    - name: Run Executable (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $exe = "build/src/target.exe"
        if (-not (Test-Path $exe)) {
          Write-Host "Executable not found"
          exit 1
        }
        Write-Host "Running $exe..."
        & $exe --input-file materials/input_100.txt
        if ($LASTEXITCODE -ne 0) {
          exit $LASTEXITCODE
        }
