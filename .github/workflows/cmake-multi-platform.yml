name: CMake CI

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl

    steps:
    # Обязательно загружаем подмодули (CLI11, benchmark и т.д.)
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    # Установка Ninja, TBB и свежего GCC 14 на Linux
    - name: Install Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build libtbb-dev g++-14 gcc-14

    # Перенаправляем стандартный gcc на gcc-14 для поддержки модулей C++20
    - name: Set GCC 14 paths
      if: matrix.c_compiler == 'gcc'
      run: |
        echo "CC=gcc-14" >> $GITHUB_ENV
        echo "CXX=g++-14" >> $GITHUB_ENV

    # Установка Ninja и TBB на Windows через vcpkg
    - name: Install Dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        choco install ninja -y
        vcpkg install tbb:x64-windows

    # Настройка окружения MSVC для Windows
    - name: Set up MSVC Developer Command Prompt
      if: matrix.os == 'windows-latest'
      uses: ilammy/msvc-dev-cmd@v1

    # Конфигурация CMake (Linux)
    - name: Configure CMake (Linux)
      if: runner.os != 'Windows'
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_C_COMPILER=${{ env.CC != '' && env.CC || matrix.c_compiler }} \
          -DCMAKE_CXX_COMPILER=${{ env.CXX != '' && env.CXX || matrix.cpp_compiler }} \
          -DCMAKE_CXX_SCAN_FOR_MODULES=ON

    # Конфигурация CMake (Windows)
    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        cmake -B build -G Ninja `
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} `
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} `
          -DCMAKE_CXX_SCAN_FOR_MODULES=ON `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

    # Сборка проекта
    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }}

    # Запуск программы (Linux)
    - name: Run Executable (Linux)
      if: runner.os != 'Windows'
      run: |
        EXE=$(find build -maxdepth 2 -type f -executable ! -name "*.so" ! -name "*.a" | head -n 1)
        if [ -n "$EXE" ]; then
          echo "Running $EXE..."
          "$EXE" --input-file materials/input_100.txt
        else
          echo "Executable not found"
          exit 1
        fi

    # Запуск программы (Windows)
    - name: Run Executable (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        $exe = Get-ChildItem -Path build -Recurse -Filter *.exe | Select-Object -First 1
        if ($exe) {
            Write-Host "Running $($exe.FullName)..."
            & $exe.FullName --input-file materials/input_100.txt
        } else {
            Write-Host "Executable not found"
            exit 1
        }
